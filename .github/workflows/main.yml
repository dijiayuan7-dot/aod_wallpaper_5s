name: Build AOD Wallpaper 5s

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f xposed-api/build.gradle
          test -f app/src/main/assets/xposed_init

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aod-wallpaper-5s
          path: app/build/outputs/apk/debug/app-debug.apk
